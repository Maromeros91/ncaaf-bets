name: Actualizar visor

on:
  push:
    paths:
      - "partidos.csv"
      - "modelos.csv"
      - "equipos_manual.csv"
      - "logo_ncaaf.png"
      - "template.html"
      - "build.py"
      - ".github/workflows/actualizar.yml"
  workflow_dispatch:

concurrency:
  group: visor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pillow requests
      - run: python build.py
      - name: Guardar catalogo y logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipos.csv logos
          git diff --cached --quiet || git commit -m "Actualizar catalogo de equipos"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
